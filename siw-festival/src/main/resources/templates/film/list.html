<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${festival.nome} + ' ' + ${festival.anno} + ' - Film'">Lorem Ipsum Film Festival 2025 - Film
    </title>
    <link rel="stylesheet" href="css/stile.css">
</head>

<body>
    <h3>
        <a href="/">Torna alla homepage</a>
    </h3>

    <div>
        <ul>
            <li th:each="film : ${filmList}">
                <a th:href="@{'/film/' + ${film.id}}" th:text="${film.titolo}">Inception</a>
            </li>
        </ul>
    </div>
</body>

</html>
