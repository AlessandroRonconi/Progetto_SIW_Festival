<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modifica Recensione</title>
    <link rel="stylesheet" href="/css/stile.css">
</head>

<body>
    <h3>
        <a th:href="@{'/film/' + ${fId}}">Annulla e torna al film</a>
    </h3>

    <h1>Modifica la tua recensione</h1>

    <form th:action="@{'/film/' + ${fId} + '/recensioni/' + ${recensione.id} + '/edit'}" method="POST"
        th:object="${recensione}">

        <div>
            <label for="voto">Voto (da 1 a 10):</label>
            <select id="voto" th:field="*{voto}">
                <option th:each="i : ${#numbers.sequence(1, 10)}" th:value="${i}" th:text="${i}">
                </option>
            </select>
            <span th:if="${#fields.hasErrors('voto')}" th:errors="*{voto}">Errore voto</span>
        </div>

        <div>
            <label for="testo">Testo:</label>
            <input id="testo" required type="text" th:field="*{testo}" />
            <span th:if="${#fields.hasErrors('testo')}" th:errors="*{testo}">Errore testo</span>
        </div>

        <button type="submit">Salva Modifiche</button>
    </form>
</body>

</html>
