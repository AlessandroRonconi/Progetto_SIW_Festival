<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${regista.nome} + ' ' + ${regista.cognome} + ' - Dettagli'">Pizzibarbaro Della Maremma - Dettagli
    </title>
    <link rel="stylesheet" th:href="@{/css/stile.css}">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="page-container">

        <a href="#" onclick="history.back(); return false;" class="mb-2" style="display:inline-block;">← Torna
            indietro</a>

        <h1 th:text="${regista.nome} + ' ' + ${regista.cognome}">Pizzibarbaro Della Maremma</h1>

        <p class="text-muted mb-3"
            th:text="${regista.nazionalita} + ' · ' + ${#temporals.format(regista.dataNascita, 'dd/MM/yyyy')}">
            Italia · 01/01/1999</p>

        <h2 class="section-title">Film</h2>
        <div class="grid grid-3">
            <div class="card" th:each="film : ${filmList}">
                <h3 class="card-title" th:text="${film.titolo}">Il Sindaco di Lignano</h3>
                <p class="card-subtitle" th:text="${film.anno}">2019</p>
                <div class="card-footer">
                    <a th:href="@{'/film/' + ${film.id}}" class="btn btn-outline btn-sm">Dettagli</a>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
