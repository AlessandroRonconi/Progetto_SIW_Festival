<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> SIWFestival - Nuova Sala </title>
    <link rel="stylesheet" th:href="@{/css/stile.css}">
</head>

<body>
    <h3>
        <a href="/">Torna alla homepage</a>
    </h3>

    <h1>Nuova Sala</h1>

    <form th:action="@{/admin/sale/new}" method="POST" th:object="${sala}">
        <div>
            Nome: <span><input type="text" th:field="*{nome}" /></span>
            <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="error-message"></span>
        </div>
        <div>
            Indirizzo: <span><input type="text" th:field="*{indirizzo}" /></span>
            <span th:if="${#fields.hasErrors('indirizzo')}" th:errors="*{indirizzo}" class="error-message"></span>
        </div>
        <div>
            Capienza: <span><input type="text" th:field="*{capienza}" /></span>
            <span th:if="${#fields.hasErrors('capienza')}" th:errors="*{capienza}" class="error-message"></span>
        </div>
        <div>
            <button type="submit">Salva</button>
        </div>
    </form>
</body>

</html>
