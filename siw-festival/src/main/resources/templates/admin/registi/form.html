<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> Nuovo Regista (Admin)</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}">
</head>

<body>
    <h3>
        <a href="/">Torna alla homepage</a>
    </h3>

    <h1>Nuovo Regista</h1>

    <form th:action="@{/admin/registi/new}" method="POST" th:object="${regista}">

        <p th:if="${errore}" th:text="${errore}" style="color:red;">Errore</p>

        <div>
            Nome: <span><input type="text" th:field="*{nome}" /></span>
            <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" class="error-message"></span>
        </div>
        <div>
            Cognome: <span><input type="text" th:field="*{cognome}" /></span>
            <span th:if="${#fields.hasErrors('cognome')}" th:errors="*{cognome}" class="error-message"></span>
        </div>
        <div>
            Data di nascita: <span><input type="date" th:field="*{dataNascita}" /></span>
            <span th:if="${#fields.hasErrors('dataNascita')}" th:errors="*{dataNascita}" class="error-message"></span>
        </div>
        <div>
            Nazionalità: <span><input type="text" th:field="*{nazionalita}" /></span>
            <span th:if="${#fields.hasErrors('nazionalita')}" th:errors="*{nazionalita}" class="error-message"></span>
        </div>
        <div>
            <button type="submit">Salva</button>
        </div>
    </form>
</body>

</html>
