<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIWFestival - Lista dei Registi (Admin)</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="page-container">

        <a href="#" onclick="history.back(); return false;" class="mb-2" style="display:inline-block;">← Torna
            indietro</a>

        <div class="flex-between mb-3">
            <h1 class="page-title" style="margin-bottom: 0;">Registi</h1>
            <a th:href="@{/admin/registi/new}" class="btn btn-accent btn-sm">Nuovo regista</a>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="regista : ${registiList}">
                        <td>
                            <a th:href="@{'/registi/' + ${regista.id}}"
                                th:text="${regista.nome} + ' ' + ${regista.cognome}">Francesco Cilurzo</a>
                        </td>
                        <td>
                            <a th:href="@{'/admin/registi/' + ${regista.id} + '/edit'}"
                                class="btn btn-outline btn-sm">Modifica</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</body>

</html>
