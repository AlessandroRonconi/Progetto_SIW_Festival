<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> SIWFestival - Admin Console </title>
    <link rel="stylesheet" th:href="@{/css/stile.css}">
</head>

<body>
    <h1>
        <a href="/admin/festival"><span th:text="'Lista dei Festival' + ' (' + ${numeroFestival} + ')'">Lista dei
                Festival (1)</span></a>
    </h1>

    <h1>
        <a href="/admin/film">Lista dei Film</a>
    </h1>

    <h1>
        <a href="/admin/registi">Lista dei Registi</a>
    </h1>

    <h1>
        <a href="/admin/sale">Lista delle Sale</a>
    </h1>

    <h2 th:if="${userDetails == null}">
        <a href="/login">Effettua il Login</a>
    </h2>

    <h2 th:if="${userDetails == null}">
        <a href="/register">Registrati</a>
    </h2>

    <div th:if="${userDetails}">
        <span th:text="${userDetails.username}"></span>
        <form th:action="@{/logout}" method="POST" style="display:inline;">
            <button type="submit">Logout</button>
        </form>
    </div>
</body>

</html>
