<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> SIWFestival - Lista dei Film (Admin)</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}">
</head>

<body>
    <h3>
        <a href="/">Torna alla homepage</a>
    </h3>

    <div>
        <ul>
            <li th:each="film : ${filmList}">
                <a th:href="@{'/film/' + ${film.id}}" th:text="${film.titolo} + ' (' + ${film.anno} + ' )'">Film
                    placeholder (2005)</a>
                <a th:href="@{'/admin/film/' + ${film.id} + '/edit'}">
                    <button type="submit">Modifica</button>
                </a>
            </li>
        </ul>
    </div>

    <a th:href="@{/admin/film/new}">Nuovo film</a>
</body>

</html>
