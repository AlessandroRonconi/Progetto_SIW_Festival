<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuovo Film (Admin)</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="page-container">

        <a href="#" onclick="history.back(); return false;" class="mb-2" style="display:inline-block;">← Torna
            indietro</a>

        <h1 class="page-title">Nuovo Film</h1>

        <form th:action="@{/admin/film/new}" method="POST" th:object="${film}" class="form-container"
            style="max-width: 600px;">

            <div th:if="${errore}" class="alert alert-danger" th:text="${errore}">Errore</div>

            <div class="form-group">
                <label for="titolo">Titolo</label>
                <input id="titolo" type="text" th:field="*{titolo}" class="form-control" />
                <div th:if="${#fields.hasErrors('titolo')}" th:errors="*{titolo}" class="form-error"></div>
            </div>

            <div class="grid grid-2">
                <div class="form-group">
                    <label for="anno">Anno</label>
                    <input id="anno" type="text" th:field="*{anno}" class="form-control" />
                    <div th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}" class="form-error"></div>
                </div>
                <div class="form-group">
                    <label for="durata">Durata (min)</label>
                    <input id="durata" type="text" th:field="*{durata}" class="form-control" />
                    <div th:if="${#fields.hasErrors('durata')}" th:errors="*{durata}" class="form-error"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="regista">Regista</label>
                <select id="regista" th:field="*{regista}" class="form-control">
                    <option value="" selected>-- Seleziona un Regista --</option>
                    <option th:each="r : ${registiList}" th:value="${r.id}" th:text="${r.nome + ' ' + r.cognome}">
                    </option>
                </select>
                <div th:if="${#fields.hasErrors('regista')}" th:errors="*{regista}" class="form-error"></div>
            </div>

            <div class="grid grid-2">
                <div class="form-group">
                    <label for="genere">Genere</label>
                    <input id="genere" type="text" th:field="*{genere}" class="form-control" />
                    <div th:if="${#fields.hasErrors('genere')}" th:errors="*{genere}" class="form-error"></div>
                </div>
                <div class="form-group">
                    <label for="paeseProduzione">Paese di produzione</label>
                    <input id="paeseProduzione" type="text" th:field="*{paeseProduzione}" class="form-control" />
                    <div th:if="${#fields.hasErrors('paeseProduzione')}" th:errors="*{paeseProduzione}"
                        class="form-error"></div>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Salva</button>
            </div>

        </form>

    </div>
</body>

</html>
