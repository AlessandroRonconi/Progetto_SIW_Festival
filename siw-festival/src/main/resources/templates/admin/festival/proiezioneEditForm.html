<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modifica proiezione (Admin)</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="page-container">

        <a th:href="@{'/admin/festival/' + ${festival.id}}" class="mb-2" style="display:inline-block;">← Torna al
            festival</a>

        <h1 class="page-title" th:text="'Modifica proiezione - ' + ${festival.nome}">Modifica proiezione</h1>

        <div th:if="${errore}" class="alert alert-danger" th:text="${errore}">Errore</div>

        <form th:action="@{'/admin/proiezioni/' + ${proiezione.id} + '/edit'}" th:object="${proiezione}" method="POST"
            class="form-container" style="max-width: 600px;">

            <div class="grid grid-2">
                <div class="form-group">
                    <label for="data">Data</label>
                    <input type="date" id="data" th:field="*{data}" required class="form-control" />
                    <div th:if="${#fields.hasErrors('data')}" th:errors="*{data}" class="form-error"></div>
                </div>
                <div class="form-group">
                    <label for="ora">Ora</label>
                    <input type="time" id="ora" th:field="*{ora}" required class="form-control" />
                    <div th:if="${#fields.hasErrors('ora')}" th:errors="*{ora}" class="form-error"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="film">Film</label>
                <select id="film" th:field="*{film.id}" required class="form-control">
                    <option th:each="f : ${filmList}" th:value="${f.id}" th:text="${f.titolo}">Titolo film</option>
                </select>
                <div th:if="${#fields.hasErrors('film')}" th:errors="*{film}" class="form-error"></div>
            </div>

            <div class="form-group">
                <label for="sala">Sala</label>
                <select id="sala" th:field="*{sala.id}" required class="form-control">
                    <option th:each="s : ${salaList}" th:value="${s.id}"
                        th:text="${s.nome} + ' (' + ${s.capienza} + ' posti)'">Sala</option>
                </select>
                <div th:if="${#fields.hasErrors('sala')}" th:errors="*{sala}" class="form-error"></div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Salva</button>
            </div>

        </form>

    </div>
</body>

</html>
