<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIWFestival - Registrazione</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}">
</head>

<body>
    <h3>
        <a href="/">Torna alla homepage</a>
    </h3>

    <h1>Registrazione</h1>

    <div th:if="${error}" style="color:red; margin-bottom: 10px;" th:text="${error}"></div>

    <h1>Registrazione nuovo utente</h1>
    <form th:action="@{/register}" method="POST">
        <div>
            <label>Nome</label>
            <span><input type="text" placeholder="name" required th:field="${user.name}" /></span>
            <span th:if="${#fields.hasErrors('user.name')}" th:errors="${user.name}" class="error-message">
            </span>
        </div>
        <div>
            <label>Cognome</label>
            <span><input type="text" placeholder="surname" required th:field="${user.surname}" /></span>
            <span th:if="${#fields.hasErrors('user.surname')}" th:errors="${user.surname}" class="error-message">
            </span>
        </div>
        <div>
            <label>Email</label>
            <span><input type="text" placeholder="email" required th:field="${user.email}" /></span>
            <span th:if="${#fields.hasErrors('user.email')}" th:errors="${user.email}" class="error-message">
            </span>
        </div>
        <div>
            <label>Username</label>
            <span>
                <input type="text" placeholder="username" required th:field="${credentials.username}" />
            </span>
            <span th:if="${#fields.hasErrors('credentials.username')}" th:errors="${credentials.username}"
                class="error-message">
            </span>
        </div>
        <div>
            <label>Password</label>
            <span><input type="password" placeholder="password" required th:field="${credentials.password}" />
            </span>
            <span th:if="${#fields.hasErrors('credentials.password')}" th:errors="${credentials.password}"
                class="error-message">
            </span>
        </div>
        <div>
            <button type="submit">Registra</button>
        </div>
    </form>

</body>

</html>
