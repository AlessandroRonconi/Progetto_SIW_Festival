<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIWFestival - Registrazione</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="page-container">

        <a href="#" onclick="history.back(); return false;" class="mb-2" style="display:inline-block;">← Torna
            indietro</a>

        <h1 class="page-title text-center">Registrazione</h1>

        <div th:if="${error}" class="alert alert-danger" style="max-width:480px; margin:0 auto 1rem auto;"
            th:text="${error}"></div>

        <form th:action="@{/register}" method="POST" class="form-container">

            <div th:object="${user}">
                <div class="form-group">
                    <label for="name">Nome</label>
                    <input id="name" type="text" placeholder="Nome" required th:field="*{name}" class="form-control" />
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="form-error"></div>
                </div>
                <div class="form-group">
                    <label for="surname">Cognome</label>
                    <input id="surname" type="text" placeholder="Cognome" required th:field="*{surname}"
                        class="form-control" />
                    <div th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}" class="form-error"></div>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="Email" required th:field="*{email}"
                        class="form-control" />
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="form-error"></div>
                </div>
            </div>

            <div th:object="${credentials}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" type="text" placeholder="Username" required th:field="*{username}"
                        class="form-control" />
                    <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="form-error"></div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Password" required th:field="*{password}"
                        class="form-control" />
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="form-error"></div>
                </div>
            </div>

            <div class="form-actions" style="justify-content: center;">
                <button type="submit" class="btn btn-primary">Registra</button>
            </div>

        </form>

    </div>
</body>

</html>
