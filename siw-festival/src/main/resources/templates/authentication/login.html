<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIWFestival - Login</title>
    <link rel="stylesheet" href="css/stile.css">
</head>

<body>
    <h3>
        <a href="/">Torna alla homepage</a>
    </h3>

    <h1>Login</h1>

    <p th:if="${errorMessage}" style="color: red;">
        <!--grazie a questo vedi l'errore passato come parametro da authcontroller-->
        <span th:text="${errorMessage}">Username o password non validi</span>
    </p>

    <form th:action="@{/login}" method="POST">
        <div>
            <span>Username:</span>
            <span><input name="username" type="text" required /></span>
        </div>
        <div>
            <span>Password:</span>
            <span><input name="password" type="password" required /></span>
        </div>
        <div>
            <span th:if="${param.error != null}">Username o password errati</span>
        </div>
        <div>
            <span><button type="submit">Login</button></span>
        </div>
    </form>

</body>

</html>
