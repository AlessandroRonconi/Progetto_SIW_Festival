<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIWFestival - Login</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="page-container">

        <a href="#" onclick="history.back(); return false;" class="mb-2" style="display:inline-block;">← Torna
            indietro</a>

        <h1 class="page-title text-center">Login</h1>

        <div th:if="${errorMessage}" class="alert alert-danger" style="max-width:480px; margin:0 auto 1rem auto;">
            <span th:text="${errorMessage}">Username o password non validi</span>
        </div>
        <div th:if="${param.error != null and errorMessage == null}" class="alert alert-danger"
            style="max-width:480px; margin:0 auto 1rem auto;">
            Username o password errati
        </div>

        <form th:action="@{/login}" method="POST" class="form-container">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" required class="form-control" />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" required class="form-control" />
            </div>
            <div class="form-actions" style="justify-content: center;">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>

    </div>
</body>

</html>
