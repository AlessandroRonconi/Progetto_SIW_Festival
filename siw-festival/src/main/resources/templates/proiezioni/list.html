<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${festival.nome} + ' ' + ${festival.anno} + ' - Programmazione'">Lorem Ipsum Film Festival 2025 - Programmazione
    </title>
    <link rel="stylesheet" href="css/stile.css">
</head>

<body>
    <h3>
        <a href="/">Torna alla homepage</a>
    </h3>

    <div>
        <ul>
            <li th:each="proiezione : ${proiezioniList}">
                <p th:text="${#temporals.format(proiezione.data, 'dd/MM/yyyy')}">01/01/2025:
                <a th:href="@{'/film/' + ${film.id}}" th:text="${proiezione.film.nome}">Inception</a>
                </p>
            </li>
        </ul>
    </div>
</body>

</html>
