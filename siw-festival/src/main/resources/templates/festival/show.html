<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${festival.nome} + ' ' + ${festival.anno} + ' - Dettagli'">Lorem Ipsum Film Festival 2025 - Dettagli
    </title>
    <link rel="stylesheet" href="css/stile.css">
</head>

<body>
    <h3>
        <a href="/">Torna alla homepage</a>
    </h3>

    <h1 th:text="${festival.nome} + ' ' + ${festival.anno}">Lorem Ipsum Film Festival 2025</h1>

    <h2
        th:text="${festival.citta} + ', ' + ${#temporals.format(festival.dataInizio, 'dd/MM/yyyy')} + ' - ' + ${#temporals.format(festival.dataFine, 'dd/MM/yyyy')}">
        Milano, 01/01/2025 - 08/01/2025
    </h2>

    <span th:text="${festival.descrizione}"> Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vestibulum
        consequat mi quis pretium semper.</span>

    <h3>
        <a th:href="@{'/festival/' + ${festival.id} + '/film'}">Tutti i film in concorso</a>
    </h3>

    <h3>
        <a th:href="@{'/festival/' + ${festival.id} + '/proiezioni'}">Programma delle proiezioni</a>
    </h3>

</body>

</html>
