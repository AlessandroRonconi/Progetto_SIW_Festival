<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title> SIWFestival - Lista dei Festival </title>
    <link rel="stylesheet" th:href="@{/css/stile.css}">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <a href="#" onclick="history.back(); return false;">← Torna indietro</a>

    <div>
        <ul>
            <li th:each="festival : ${festivalList}">
                <a th:href="@{'/festival/' + ${festival.id}}" th:text="${festival.nome}">
            </li>
        </ul>
    </div>
</body>

</html>
